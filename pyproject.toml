[project]
name = "isabelle-python-eval"
version = "0.1.0"
description = "Differential tests and benchmarks of Python code generated from Isabelle/HOL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "sortedcontainers>=2.4.0",
    "sympy>=1.14.0",
]

[tool.pytest.ini_options]
# One folder per data structure; importlib mode lets test files in different folders share a name.
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]
